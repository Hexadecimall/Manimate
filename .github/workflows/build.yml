name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos, arch: universal }
          - { os: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { os: windows-2022, platform: windows, arch: x86_64 }

    steps:
      - uses: actions/checkout@v4

      - name: Read the project version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt | head -n 1)
          test -n "$version" || { echo "could not read VERSION from CMakeLists.txt" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Qt 6 on a bare Ubuntu runner needs its X and GL dependencies, and
      # linuxdeploy needs FUSE to run its own AppImage.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype6-dev \
            libfuse2 desktop-file-utils file

      - name: Install NSIS
        if: matrix.platform == 'windows'
        run: choco install nsis --no-progress -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true

      # Manim and a Python to run it are shipped inside the package, so a
      # render works on a machine that has neither. A standalone build is used
      # rather than the runner's own Python: that one is not relocatable, and a
      # copy of it would break the moment it left this machine.
      - name: Fetch a standalone Python
        shell: bash
        env:
          PYTHON_BUILD: 20250106
          PYTHON_VERSION: 3.12.8
        run: |
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            macos-*)   target="aarch64-apple-darwin" ;;
            linux-*)   target="x86_64-unknown-linux-gnu" ;;
            windows-*) target="x86_64-pc-windows-msvc-shared" ;;
          esac

          base="https://github.com/astral-sh/python-build-standalone/releases/download"
          url="$base/${PYTHON_BUILD}/cpython-${PYTHON_VERSION}+${PYTHON_BUILD}-${target}-install_only.tar.gz"

          echo "fetching $url"
          curl -fsSL -o python.tar.gz "$url"
          mkdir -p runtime
          tar -xzf python.tar.gz -C runtime --strip-components=1

          if [ "${{ matrix.platform }}" = windows ]; then
            interpreter="runtime/python.exe"
          else
            interpreter="runtime/bin/python3"
          fi

          "$interpreter" -m pip install --upgrade pip

          # manim pulls in what it needs to draw: pycairo for the canvas and
          # manimpango for text, both as wheels carrying their own libraries.
          # imageio-ffmpeg carries an ffmpeg binary, which manim needs to turn
          # frames into a video and which is not otherwise on a clean machine.
          "$interpreter" -m pip install manim imageio-ffmpeg

          # Put ffmpeg where the interpreter's own bin is, so adding one
          # directory to PATH is enough for a render to find everything.
          "$interpreter" - <<'PYTHON'
          import imageio_ffmpeg, os, shutil, stat, sys

          source = imageio_ffmpeg.get_ffmpeg_exe()
          root = os.path.dirname(os.path.dirname(os.path.abspath(sys.executable)))
          target_dir = os.path.join(root, "bin") if os.name != "nt" else root
          os.makedirs(target_dir, exist_ok=True)

          target = os.path.join(target_dir, "ffmpeg.exe" if os.name == "nt" else "ffmpeg")
          shutil.copy2(source, target)
          os.chmod(target, os.stat(target).st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
          print("bundled ffmpeg ->", target)
          PYTHON

          # Prove all of it before it is packaged: a build that ships a Manim
          # which cannot import, or an ffmpeg that cannot run, is worse than one
          # that ships neither.
          "$interpreter" -c "import manim, cairo, manimpango; print('manim', manim.__version__, '| cairo', cairo.version)"
          if [ "${{ matrix.platform }}" = windows ]; then
            ./runtime/ffmpeg.exe -version | head -1
          else
            ./runtime/bin/ffmpeg -version | head -1
          fi

          # Trim what a render never needs. The download is large enough
          # without pip's caches and every test suite in site-packages.
          find runtime -type d -name "__pycache__" -prune -exec rm -rf {} + 2>/dev/null || true
          find runtime -type d -name "tests" -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf runtime/lib/python*/test runtime/lib/python*/idlelib runtime/lib/python*/tkinter

          du -sh runtime

      - name: Configure
        shell: bash
        run: |
          # Qt's macOS binaries are universal, so one build covers both
          # Apple silicon and Intel.
          extra=""
          if [ "${{ matrix.platform }}" = macos ]; then
            extra='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DMANIMATE_BUNDLED_PYTHON="$PWD/runtime" \
            $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --build-config Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release

      # A .app in a .zip, for anyone who would rather not run an installer.
      # ditto is used rather than a generic zip because it is the only thing
      # that reliably preserves the symlinks inside Qt's frameworks.
      - name: Build the portable macOS archive
        if: matrix.platform == 'macos'
        run: |
          cmake --install build --prefix "$PWD/stage"
          ditto -c -k --keepParent --sequesterRsrc \
            "$PWD/stage/Manimate.app" \
            "build/Manimate-${{ steps.version.outputs.version }}-macos-universal.zip"

      # linuxdeploy produces the AppImage users expect; CPack's tarball is kept
      # alongside it for anyone who would rather unpack it themselves.
      - name: Build AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/AppDir/usr"

          base="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          curl -fsSL -o linuxdeploy.AppImage "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          export EXTRA_QT_MODULES=""
          export OUTPUT="Manimate-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/app.manimate.editor.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/app.manimate.editor.png \
            --output appimage

          mkdir -p build/dist
          mv "$OUTPUT" build/dist/

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p dist
          # Everything CPack and linuxdeploy produced, and nothing else.
          find build -maxdepth 2 \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' \) \
            -not -path '*/_CPack_Packages/*' -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: manimate-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  lint-installers:
    name: lint installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sh -n install.sh
          shellcheck --shell=sh install.sh

      - name: Check install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning `
            -ErrorAction SilentlyContinue | Tee-Object -Variable found
          if ($found | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

  release:
    name: release ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [build, lint-installers]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { platform: macos, arch: universal }
          - { platform: linux, arch: x86_64 }
          - { platform: windows, arch: x86_64 }

    steps:
      - uses: actions/checkout@v4

      - name: Read the project version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: manimate-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist

      # One release per platform and architecture, so a user (or install.sh)
      # can go straight to the build for their machine.
      #
      # A push to main republishes the moving `-dev` release at that commit; a
      # pushed `v*` tag publishes a permanent one. Done with the REST API
      # directly, so the workflow depends on no CLI beyond curl.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          suffix="${{ matrix.platform }}-${{ matrix.arch }}"

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="v${version}-${suffix}"
            title="Manimate ${version} — ${{ matrix.platform }} ${{ matrix.arch }}"
            prerelease=false
            notes="Release build of ${version} for ${{ matrix.platform }} ${{ matrix.arch }}."
          else
            tag="v${version}-${suffix}-dev"
            title="Manimate ${version} — ${{ matrix.platform }} ${{ matrix.arch }} (dev)"
            prerelease=true
            notes="Development build from \`main\` at ${SHA}. Overwritten by every push."
          fi

          api="https://api.github.com/repos/${REPO}"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"

          # A dev release moves with main, so clear the previous one first. A
          # tagged release is permanent and must never be replaced silently.
          existing=$(curl -fsSL -H "$auth" -H "$accept" "${api}/releases/tags/${tag}" || true)
          release_id=$(printf '%s' "$existing" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -n 1)

          if [ -n "$release_id" ]; then
            if [ "$prerelease" = "false" ]; then
              echo "Release ${tag} already exists; refusing to replace a tagged release." >&2
              exit 1
            fi
            echo "Replacing existing dev release ${tag} (${release_id})"
            curl -fsSL -X DELETE -H "$auth" -H "$accept" "${api}/releases/${release_id}" >/dev/null
            curl -fsSL -X DELETE -H "$auth" -H "$accept" \
              "${api}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
          fi

          created=$(curl -fsSL -X POST -H "$auth" -H "$accept" \
            "${api}/releases" \
            -d "$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","body":"%s","prerelease":%s,"draft":false}' \
                  "$tag" "$SHA" "$title" "$notes" "$prerelease")")

          release_id=$(printf '%s' "$created" | sed -n 's/.*"id": *\([0-9]*\).*/\1/p' | head -n 1)
          test -n "$release_id" || { echo "could not create release ${tag}" >&2; exit 1; }
          echo "Created ${tag} (${release_id})"

          for file in dist/*; do
            name=$(basename "$file")
            echo "Uploading ${name}"
            curl -fsSL -X POST -H "$auth" -H "$accept" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${REPO}/releases/${release_id}/assets?name=${name}" \
              >/dev/null
          done

          echo "Published ${tag}"
